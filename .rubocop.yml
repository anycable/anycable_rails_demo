require:
  - ruby-next/rubocop

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance
  - rubocop-rails

inherit_gem:
  standard: config/base.yml

inherit_from:
  - .rubocop/rspec.yml
  - .rubocop/rails.yml

AllCops:
  Exclude:
    - 'bin/*'
    - 'tmp/**/*'
    - 'Gemfile'
    - 'vendor/**/*'
    - 'gemfiles/**/*'
    - 'node_modules/**/*'
  DisplayCopNames: true
  NewCops: disable
  TargetRubyVersion: next

Style/FrozenStringLiteralComment:
  Enabled: true
